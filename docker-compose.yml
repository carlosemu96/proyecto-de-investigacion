services:
  grupone-api:
    image: grupone-api:local
    pull_policy: build
    build:
      context: ./grupone
      dockerfile: Dockerfile
    container_name: grupone-api
    environment:
      MONGODB_URI: mongodb://mongodb:27017/grupo_ne_maintenance
      SERVER_PORT: 8080
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/grupone
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/grupone/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_started
      keycloak:
        condition: service_started

  mongodb:
    image: mongo:7
    container_name: grupone-mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb/data:/data/db

  keycloak-postgres:
    image: postgres:16
    container_name: grupone-keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./keycloak/postgres/data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: grupone-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/providers:/opt/keycloak/providers
      - ./keycloak/themes:/opt/keycloak/themes
    depends_on:
      keycloak-postgres:
        condition: service_started
