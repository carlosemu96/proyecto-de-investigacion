spring:
  application:
    name: maintenance-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/grupo_ne_maintenance}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
